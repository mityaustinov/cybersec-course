<script>
// Add a GitHub-style "#" anchor link next to every heading that has an id
// (kramdown generates ids for all headings automatically).
(function () {
  var headings = document.querySelectorAll(
    ".markdown-body h1[id], .markdown-body h2[id], .markdown-body h3[id], " +
    ".markdown-body h4[id], .markdown-body h5[id], .markdown-body h6[id]"
  );
  Array.prototype.forEach.call(headings, function (h) {
    var a = document.createElement("a");
    a.className = "heading-anchor";
    a.href = "#" + h.id;
    a.textContent = "#";
    a.setAttribute("aria-label", "Link to this section: " + h.textContent.trim());
    h.appendChild(document.createTextNode(" "));
    h.appendChild(a);
  });
})();
</script>
